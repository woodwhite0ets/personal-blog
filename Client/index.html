<!doctype html>
<html lang="zh-CN" data-theme="editorial">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-blue-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/icon-blue-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/icon-blue-180.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/brand/icon-blue-512.png" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/jetbrains-mono-400.woff2" crossorigin />
    <!-- 字体预加载只保留实际用到的这一款：站点等宽字体（自托管）。
         Geist 走 @fontsource 的 unicode-range 分片，浏览器只取 latin，不需要手动 preload。
         曾被删掉的 EB Garamond / Caveat 的 preload 仍留在这里，线上每次访问都 404，已清理。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>woodwhite@blog — 技术博客 | 全栈开发 | 开源分享</title>

    <!-- SEO 基础 -->
    <meta name="description" content="woodwhite@blog 是一个技术博客与社区论坛，分享全栈开发、Vue 3、Express 5、MySQL 等技术文章。支持 Markdown 写作、多主题切换、游客浏览。" />
    <meta name="author" content="WoodWhite" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />

    <!-- Open Graph（社交媒体分享） -->
    <meta property="og:site_name" content="woodwhite@blog" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="woodwhite@blog — 技术博客" />
    <meta property="og:description" content="全栈开发技术博客与社区论坛，分享 Vue 3、Express 5、MySQL 等技术文章。" />
    <meta property="og:url" content="https://blog.woodwhite.top" />
    <meta property="og:image" content="https://blog.woodwhite.top/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="zh_CN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="woodwhite@blog" />
    <meta name="twitter:image" content="https://blog.woodwhite.top/og-default.jpg" />
    <meta name="twitter:description" content="全栈开发技术博客与社区论坛" />

    <!-- 规范化链接 -->
    <link rel="canonical" href="https://blog.woodwhite.top" />
    <link rel="alternate" type="application/rss+xml" title="woodwhite@blog" href="/feed.xml" />

    <!-- 百度站长验证（到 https://ziyuan.baidu.com/ 添加站点后替换验证码） -->
    <!-- <meta name="baidu-site-verification" content="codeva-xxxxxxxxxxxx" /> -->

    <!-- 站点只有浅色纸面一套：声明 light，避免系统深色时表单控件、滚动条被 UA 染黑 -->
    <meta name="color-scheme" content="light" />

  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
